name: Run tests for Scylla Doctor Cluster

on:
  pull_request:
    paths:
      - 'scylla-doctor-cluster/**'
      - 'scylla-doctor/**'
      - '.github/workflows/**'
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/**'
      - 'scylla-doctor-cluster/**'
      - 'scylla-doctor/**'

defaults:
  run:
    shell: bash

jobs:
  test:
    if: github.repository_owner == 'scylladb'
    runs-on: ubuntu-24.04  # noble; github-hosted (setup-python breaks in ubuntu:noble container)
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - name: Checkout sources
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -r scylla-doctor-cluster/tests/requirements.txt
          pip install -r scylla-doctor-cluster/requirements.txt

      - name: Generate scylla-doctor version file
        working-directory: scylla-doctor
        run: make version

      - name: Lint
        working-directory: scylla-doctor-cluster
        run: python -m flake8

      - name: Test
        working-directory: scylla-doctor-cluster
        env:
          PYTHONPATH: ${{ github.workspace }}/scylla-doctor-cluster:${{ github.workspace }}/scylla-doctor
        run: python -m pytest -vv

      - name: Build portable archive
        working-directory: scylla-doctor-cluster
        run: make portable

      - name: Smoke test portable archive
        run: python scylla-doctor-cluster/scylla_doctor_cluster.pyz --version
